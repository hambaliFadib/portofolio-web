name: P4-B Homepage Regression (PR Validation)
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  homepage-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start owned production server
        run: |
          mkdir -p "$RUNNER_TEMP/p4b-regression"
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/p4b-regression/server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/p4b-regression/server.pid"
          curl --retry 40 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
      - name: Run all fourteen homepage assertions
        env:
          B03_PREVIEW_URL: http://127.0.0.1:3000
          B03_HOMEPAGE_OUTPUT_DIR: ${{ runner.temp }}/p4b-regression
        run: node design-preview/paper-reveal-b03/verify-cleanup-regression.mjs
      - name: Verify complete regression inventory
        if: always()
        env:
          REPORT: ${{ runner.temp }}/p4b-regression/repository-regression.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          if (r.checks.length !== 14 || r.counts.passed !== 14 || r.counts.failed !== 0 || r.checks.some(x => x.passed !== true)) {
            throw new Error('Homepage regression is not 14/14 PASS');
          }
          console.log('All 14 homepage regression checks passed.');
          NODE
      - name: Stop owned server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/p4b-regression/server.pid"; then
            pid="$(cat "$RUNNER_TEMP/p4b-regression/server.pid")"
            cmd="$(ps -p "$pid" -o args= || true)"
            if [[ "$cmd" == *next* ]]; then kill "$pid" || true; fi
          fi
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p4b-homepage-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/p4b-regression/
          if-no-files-found: warn
          retention-days: 14

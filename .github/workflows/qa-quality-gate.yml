name: Portfolio QA Cross-Repo
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: portfolio-qa-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portfolio-quality-gate:
    uses: hambaliFadib/playwright-portofolio-web/.github/workflows/cross-repo-quality-gate.yml@5e82ba337403dcfeef25d5bbf34a8212fee7bfc5
    permissions:
      contents: read
    with:
      application_repository: ${{ github.repository }}
      application_test_sha: ${{ github.sha }}
      application_pr_head_sha: ${{ github.event.pull_request.head.sha }}
      qa_source_sha: 5e82ba337403dcfeef25d5bbf34a8212fee7bfc5